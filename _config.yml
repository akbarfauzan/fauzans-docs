about_content: |
  Hello, I'm Fauzan. This space is a reflection of my journey—capturing my professional experiences, technical skills, and personal interests. 
  
  My path started right after graduating from vocational school, and since then, I've been continuously building my expertise in IT infrastructure to shape a strong future. Beyond the daily work managing Linux environments and enterprise mail servers, my goal is to share positive insights, inspire those around me, and build meaningful connections with great people.

