          - Developed custom Bash scripts (`script-pm.sh`, `getuser.sh`) and Ansible playbooks (`audit_carbonio.yml`) to automate server auditing, health checks, and bulk Class of Service updates.
          - Configured network security and mail gateways using FortiMail and Proxmox Mail Gateway.
      
